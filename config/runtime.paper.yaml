# Canonical configuration for the SN Computer Science revision (v1.2-sncs-r1).
#
# Dataset paths are relative to data_root (resolved against this file's directory) or to
# $KGCANDGEN_DATA_ROOT when set. Fetch and verify the benchmark files with:
#   python scripts/fetch_oaei.py --data-root data/oaei_track_cache
# Expected SHA-256 checksums are in config/oaei_manifest.csv.
#
# Grids: the complete 5 x 2 x 2 TF-IDF grid (20 cells; the [2,2] and [2,3] min_df=2 cells
# fail on two Conference pairs with an empty vocabulary, recorded in the *_errors.csv),
# the 5 x 4 BM25 grid, and a 24-cell character n-gram sensitivity grid that is reported
# separately and never used for selection. Dense baselines are listed under dense_models;
# hybrid_models fuse the default char n-gram retriever with a dense model by reciprocal rank
# (rrf_k 60, each component's top 50). Neither is tuned.
data_root: ../data/oaei_track_cache
experiments:
  evaluation_ks: [1, 5, 10, 20, 50]
  tfidf_grid:
  - ngram_range: [1, 1]
    min_df: 1
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 1]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [1, 1]
    min_df: 2
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 1]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [1, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [2, 2]
    min_df: 1
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [2, 2]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [2, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [2, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [1, 3]
    min_df: 1
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 3]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [1, 3]
    min_df: 2
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [1, 3]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [2, 3]
    min_df: 1
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [2, 3]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  - ngram_range: [2, 3]
    min_df: 2
    max_df: 1.0
    sublinear_tf: false
  - ngram_range: [2, 3]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
  bm25_grid:
  - {k1: 0.0, b: 0.0}
  - {k1: 0.0, b: 0.3}
  - {k1: 0.0, b: 0.75}
  - {k1: 0.0, b: 1.0}
  - {k1: 0.6, b: 0.0}
  - {k1: 0.6, b: 0.3}
  - {k1: 0.6, b: 0.75}
  - {k1: 0.6, b: 1.0}
  - {k1: 1.2, b: 0.0}
  - {k1: 1.2, b: 0.3}
  - {k1: 1.2, b: 0.75}
  - {k1: 1.2, b: 1.0}
  - {k1: 1.8, b: 0.0}
  - {k1: 1.8, b: 0.3}
  - {k1: 1.8, b: 0.75}
  - {k1: 1.8, b: 1.0}
  - {k1: 2.4, b: 0.0}
  - {k1: 2.4, b: 0.3}
  - {k1: 2.4, b: 0.75}
  - {k1: 2.4, b: 1.0}
  candidate_policy: nonzero
  alignment_policy: all_targets
  char_ngram_grid:
  - analyzer: char_wb
    ngram_range: [2, 4]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [2, 4]
    min_df: 2
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [2, 5]
    min_df: 2
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 3]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 3]
    min_df: 2
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 5]
    min_df: 2
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 6]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [3, 6]
    min_df: 2
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [4, 4]
    min_df: 1
    sublinear_tf: false
  - analyzer: char_wb
    ngram_range: [4, 4]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [2, 4]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [2, 4]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [2, 5]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [2, 5]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 3]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 3]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 5]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 5]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 6]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [3, 6]
    min_df: 2
    sublinear_tf: false
  - analyzer: char
    ngram_range: [4, 4]
    min_df: 1
    sublinear_tf: false
  - analyzer: char
    ngram_range: [4, 4]
    min_df: 2
    sublinear_tf: false
  # Dense baselines: fixed, pinned sentence-transformer models with exact cosine search
  # (never tuned or used for selection). MiniLM runs on every tier; BioLORD-2023 on Bio-ML.
  dense_models:
  - name: dense_minilm
    model: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    tiers: [development, kg, class]
    device: cpu
    batch_size: 256
  - name: dense_biolord
    model: FremyCompany/BioLORD-2023
    revision: 167aab527b238a50ca65224e6319215d2ff4fc9f
    tiers: [class]
    device: cpu
    batch_size: 256
  hybrid_models:
  - name: hybrid_char_minilm
    dense: dense_minilm
    tiers: [development, kg, class]
    rrf_k: 60
    depth: 50
  - name: hybrid_char_biolord
    dense: dense_biolord
    tiers: [class]
    rrf_k: 60
    depth: 50
